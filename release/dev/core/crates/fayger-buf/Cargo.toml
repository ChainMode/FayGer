[package]
name = "fayger-buf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fayger BuF 制品格式、Parser 与 Serializer (M0 里程碑)"

[lints]
workspace = true

[features]
default = []
# 暴露 proptest strategies，供下游 crate 与集成测试使用。
testing = ["dep:proptest"]

[dependencies]
fayger-error = { path = "../fayger-error" }
ciborium = { workspace = true }
ciborium-io = { workspace = true }
binrw = { workspace = true }
serde = { workspace = true }
proptest = { workspace = true, optional = true }

[dev-dependencies]
# 集成测试同时需要 testing feature 提供的 strategies、ErrorCode 比对、以及手工
# 拼装 BuF 字节流时用到的 binrw / serde derive。
fayger-buf = { path = ".", features = ["testing"] }
fayger-error = { path = "../fayger-error" }
proptest = { workspace = true }
binrw = { workspace = true }
serde = { workspace = true }
