[package]
name = "fayger-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fayger 运行基座命令行入口：可安装的 fayger 可执行程序 (M9 里程碑)"

[lints]
workspace = true

[lib]
name = "fayger_cli"
path = "src/lib.rs"

[[bin]]
name = "fayger"
path = "src/bin/fayger.rs"

[dependencies]
fayger-buf = { path = "../fayger-buf" }
fayger-error = { path = "../fayger-error" }
fayger-loader = { path = "../fayger-loader" }
fayger-runtime = { path = "../fayger-runtime" }
fayger-adapter = { path = "../fayger-adapter" }
fayger-observability = { path = "../fayger-observability" }
fayger-bridge = { path = "../fayger-bridge" }

[dev-dependencies]
proptest = { workspace = true }
