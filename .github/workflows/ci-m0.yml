name: CI - M0 (BuF core)

on:
  push:
    branches:
      - main
      - release/dev
      - "feat/m0-**"
    paths:
      - "release/dev/core/**"
      - ".github/workflows/ci-m0.yml"
  pull_request:
    branches:
      - main
      - release/dev
    paths:
      - "release/dev/core/**"
      - ".github/workflows/ci-m0.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  WORKSPACE_DIR: release/dev/core

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE_DIR }}
      - name: Clippy
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE_DIR }}
      - name: Test (debug)
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: cargo test --workspace --all-features
      # release 模式跑一遍 PBT，触发同一批 proptest cases 但走优化构建。
      # 单跑 ubuntu 一台机器即可——release 跑 PBT 主要为发现"在优化下才暴露的反例"
      # （比如 inlining 后的算术 / SIMD 行为差异），三平台没必要重复。
      - name: PBT smoke (release, ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: cargo test --workspace --all-features --release --tests

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE_DIR }}
      - name: Doc
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: cargo doc --workspace --all-features --no-deps
